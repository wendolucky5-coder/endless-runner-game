<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Endless Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-element {
            pointer-events: auto;
            background: rgba(10, 10, 25, 0.75);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            color: #fff;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: monospace;
        }
        #top-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
            pointer-events: none;
        }
        #score-board { pointer-events: auto; }
        #speed-board { pointer-events: auto; border-color: #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); color: #ff00ff; }
        
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            background: rgba(5, 5, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s ease;
        }
        .menu-card {
            background: rgba(15, 15, 35, 0.9);
            border: 3px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            margin-top: 0;
            font-size: 42px;
            letter-spacing: 4px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #00f0ff, #ff00ff);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.8);
        }
        .controls-guide {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            border-left: 4px solid #ff00ff;
        }
        .key {
            background: #333;
            border: 1px solid #555;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #00f0ff;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="top-hud">
            <div id="score-board" class="hud-element">SCORE: 00000</div>
            <div id="speed-board" class="hud-element">SPEED: 1x</div>
        </div>
    </div>

    <div id="screen-overlay">
        <div class="menu-card" id="start-card">
            <h1 id="menu-title">NEON RUNNER</h1>
            <p id="menu-desc">An endless 3D WebGL WebGL/OpenGL showcase. Dodge incoming obstacles and survive as the speed dynamically scales up!</p>
            
            <button class="btn" id="action-btn">START RUN</button>
            
            <div class="controls-guide">
                <strong>Controls:</strong><br>
                • Move Left: <span class="key">A</span> or <span class="key">←</span><br>
                • Move Right: <span class="key">D</span> or <span class="key">→</span><br>
                • Jump: <span class="key">Spacebar</span> or <span class="key">↑</span>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration & State
        const CONFIG = {
            laneWidth: 3.5,
            lanes: [-3.5, 0, 3.5], // Left, Center, Right
            chunkLength: 40,
            visibleChunks: 5,
            baseSpeed: 15,
            speedIncrement: 0.5,
            jumpForce: 12,
            gravity: 32
        };

        let scene, camera, renderer;
        let player;
        let playerLane = 1; // Start in middle lane (index 1)
        let targetX = 0;
        let playerVelocityY = 0;
        let isJumping = false;
        
        let gameActive = false;
        let score = 0;
        let gameSpeed = CONFIG.baseSpeed;
        
        let terrainChunks = [];
        let obstacles = [];
        let clock = new THREE.Clock();
        
        // UI Elements
        const scoreBoard = document.getElementById('score-board');
        const speedBoard = document.getElementById('speed-board');
        const screenOverlay = document.getElementById('screen-overlay');
        const actionBtn = document.getElementById('action-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 7);
            camera.lookAt(0, 1.5, -10);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Neon glowing down-light
            const floorLight = new THREE.PointLight(0xff00ff, 1, 30);
            floorLight.position.set(0, 10, -5);
            scene.add(floorLight);

            // 5. Create Player
            createPlayer();

            // 6. Generate Initial Endless Tracks
            for (let i = 0; i < CONFIG.visibleChunks; i++) {
                generateTrackChunk(i * -CONFIG.chunkLength);
            }

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleKeyDown);
            actionBtn.addEventListener('click', startGame);

            // Start Animation Loop
            animate();
        }

        function createPlayer() {
            const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            // Mesh Standard Material mimics modern programmable pipeline look
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00f0ff, 
                emissive: 0x005577,
                roughness: 0.2,
                metalness: 0.8
            });
            player = new THREE.Mesh(geometry, material);
            player.position.set(0, 0.6, 0);
            scene.add(player);

            // Add wireframe highlight to player
            const wireframeGeom = new THREE.EdgesGeometry(geometry);
            const wireframeMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const wireframe = new THREE.LineSegments(wireframeGeom, wireframeMat);
            player.add(wireframe);
        }

        function generateTrackChunk(zPos) {
            const chunk = new THREE.Group();
            chunk.position.z = zPos;

            // Track surface
            const trackWidth = CONFIG.laneWidth * 3;
            const geo = new THREE.PlaneGeometry(trackWidth, CONFIG.chunkLength);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x070714, 
                roughness: 0.7 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = 0;
            mesh.position.z = -CONFIG.chunkLength / 2;
            chunk.add(mesh);

            // Neon Side Rails / Grid borders
            const lineGeoLeft = new THREE.BoxGeometry(0.2, 0.2, CONFIG.chunkLength);
            const lineMatLeft = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            const railLeft = new THREE.Mesh(lineGeoLeft, lineMatLeft);
            railLeft.position.set(-trackWidth/2, 0.1, -CONFIG.chunkLength/2);
            chunk.add(railLeft);

            const railRight = railLeft.clone();
            railRight.position.x = trackWidth/2;
            railRight.material = new THREE.MeshBasicMaterial({ color: 0xff00ff });
            chunk.add(railRight);

            // Lane Divider Dashes
            for(let l = 1; l < 3; l++) {
                const xPos = -trackWidth/2 + (l * CONFIG.laneWidth);
                for(let d = 0; d < CONFIG.chunkLength; d += 8) {
                    const dashGeo = new THREE.PlaneGeometry(0.05, 3);
                    const dashMat = new THREE.MeshBasicMaterial({ color: 0x333355 });
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.rotation.x = -Math.PI / 2;
                    dash.position.set(xPos, 0.01, -d - 2);
                    chunk.add(dash);
                }
            }

            // Spawn obstacles on this chunk if it's far away enough initially
            if (zPos < -CONFIG.chunkLength) {
                spawnObstaclesForChunk(chunk);
            }

            scene.add(chunk);
            terrainChunks.push(chunk);
        }

        function spawnObstaclesForChunk(chunkGroup) {
            // Determine random setup for this segment
            const numObstacles = Math.floor(Math.random() * 2) + 1; // 1 or 2 obstacles per chunk
            const usedLanes = new Set();

            for (let i = 0; i < numObstacles; i++) {
                let laneIndex = Math.floor(Math.random() * 3);
                // Avoid putting two obstacles on top of each other in the same lane chunk
                if (usedLanes.has(laneIndex)) continue;
                usedLanes.add(laneIndex);

                const obsHeight = Math.random() > 0.3 ? 1.5 : 3.0; // low barrier vs tall pillar
                const obsGeo = new THREE.BoxGeometry(2, obsHeight, 1.5);
                const obsMat = new THREE.MeshStandardMaterial({
                    color: 0xff0055,
                    emissive: 0x550011,
                    roughness: 0.3
                });
                
                const obstacleMesh = new THREE.Mesh(obsGeo, obsMat);
                // Random position along the 40-unit chunk length
                const localZ = -(Math.random() * (CONFIG.chunkLength - 10) + 5); 
                obstacleMesh.position.set(CONFIG.lanes[laneIndex], obsHeight/2, localZ);
                
                // Add warning glow wireframe
                const edges = new THREE.EdgesGeometry(obsGeo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xff00ff }));
                obstacleMesh.add(line);

                chunkGroup.add(obstacleMesh);
                
                // Global tracker array for bounding box collision checks
                obstacles.push({
                    mesh: obstacleMesh,
                    parentChunk: chunkGroup,
                    lane: laneIndex
                });
            }
        }

        function startGame() {
            screenOverlay.classList.add('hidden');
            // Reset states
            gameActive = true;
            score = 0;
            gameSpeed = CONFIG.baseSpeed;
            playerLane = 1;
            targetX = CONFIG.lanes[playerLane];
            player.position.set(targetX, 0.6, 0);
            playerVelocityY = 0;
            isJumping = false;
            
            // Clean out current structures and reset
            obstacles = [];
            terrainChunks.forEach(c => scene.remove(c));
            terrainChunks = [];
            
            for (let i = 0; i < CONFIG.visibleChunks; i++) {
                generateTrackChunk(i * -CONFIG.chunkLength);
            }
            
            clock.getDelta(); // clear clock delta
        }

        function gameOver() {
            gameActive = false;
            menuTitle.innerText = "GAME OVER";
            menuTitle.style.color = "#ff0055";
            menuTitle.style.textShadow = "0 0 10px rgba(255, 0, 85, 0.8)";
            menuDesc.innerHTML = `You crashed! <br><br><strong>FINAL SCORE:</strong> <span style="color:#00f0ff; font-size:24px;">${Math.floor(score)}</span>`;
            actionBtn.innerText = "TRY AGAIN";
            screenOverlay.classList.remove('hidden');
        }

        function handleKeyDown(e) {
            if (!gameActive) return;

            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && playerLane > 0) {
                playerLane--;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && playerLane < 2) {
                playerLane++;
            }
            if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Spacebar') && !isJumping) {
                playerVelocityY = CONFIG.jumpForce;
                isJumping = true;
            }
            
            targetX = CONFIG.lanes[playerLane];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (gameActive) {
                // 1. Progress Score & Difficulty Speed Scaling
                score += delta * gameSpeed;
                gameSpeed += CONFIG.speedIncrement * delta;
                
                scoreBoard.innerText = "SCORE: " + String(Math.floor(score)).padStart(5, '0');
                speedBoard.innerText = "SPEED: " + (gameSpeed / CONFIG.baseSpeed).toFixed(1) + "x";

                // 2. Smooth Lane Transition Interpolation
                player.position.x = THREE.MathUtils.lerp(player.position.x, targetX, 15 * delta);

                // 3. Jump Physics Execution
                if (isJumping) {
                    playerVelocityY -= CONFIG.gravity * delta;
                    player.position.y += playerVelocityY * delta;

                    // Ground check
                    if (player.position.y <= 0.6) {
                        player.position.y = 0.6;
                        playerVelocityY = 0;
                        isJumping = false;
                    }
                }

                // 4. Infinite World Shifting & Procedural Recycle Loop
                const worldMoveDist = gameSpeed * delta;
                
                terrainChunks.forEach(chunk => {
                    chunk.position.z += worldMoveDist;
                });

                // If oldest chunk moves entirely behind player camera, cycle it to the front
                if (terrainChunks[0].position.z > CONFIG.chunkLength) {
                    const oldestChunk = terrainChunks.shift();
                    
                    // Clear references to obstacles attached to this recycled chunk
                    obstacles = obstacles.filter(obs => obs.parentChunk !== oldestChunk);
                    scene.remove(oldestChunk);

                    // Find where the furthest forward chunk is located currently
                    const furthestZ = terrainChunks[terrainChunks.length - 1].position.z;
                    generateTrackChunk(furthestZ - CONFIG.chunkLength);
                }

                // 5. Precise Collision Checking Loop
                // Compute Player standard local box coordinates converted to world bounding volume
                const playerBox = new THREE.Box3().setFromObject(player);
                
                // Add a slightly smaller box padding for a fairer gameplay feel
                playerBox.expandByScalar(-0.1); 

                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    const obsBox = new THREE.Box3().setFromObject(obs.mesh);

                    if (playerBox.intersectsBox(obsBox)) {
                        gameOver();
                        break;
                    }
                }
                
                // Slight camera breathing / shake effect based on speed
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.4, 5 * delta);
            }

            renderer.render(scene, camera);
        }

        // Initialize execution setup
        init();
    </script>
</body>
</html>
